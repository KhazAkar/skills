stages:
  - check

skill-consistency:
  stage: check
  image: python:3.12
  script:
    - git fetch origin main
    - export TARGET_REF="${CI_COMMIT_SHA}^"
    # bridge: project CI variable may still be named MISTRAL_API_KEY
    - if [ -z "${MISTRAL_MCP_API_KEY:-}" ] && [ -n "${MISTRAL_API_KEY:-}" ]; then export MISTRAL_MCP_API_KEY="$MISTRAL_API_KEY"; fi
    - python scripts/check_skills.py
